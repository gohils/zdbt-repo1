version: 2

models:
  # ---------------------------------------------------------------- hubs
  - name: hub_customer
    description: Hub of unique customer business keys (CRM customer number).
    columns:
      - name: customer_hk
        data_type: STRING
        description: Customer hash key. Primary key of the hub.
        data_tests: [unique, not_null]
      - {name: customer_id, data_type: STRING, description: "Customer business key (CRM customer number)."}
      - {name: load_ts, data_type: TIMESTAMP, description: "First time the key was seen."}
      - {name: record_source, data_type: STRING, description: "Source that first delivered the key."}

  - name: hub_order
    description: Hub of unique web shop order numbers.
    columns:
      - name: order_hk
        data_type: STRING
        description: Order hash key. Primary key of the hub.
        data_tests: [unique, not_null]
      - {name: order_id, data_type: STRING, description: "Order business key."}
      - {name: load_ts, data_type: TIMESTAMP, description: "First time the key was seen."}
      - {name: record_source, data_type: STRING, description: "Source that first delivered the key."}

  - name: hub_product
    description: Hub of unique product codes.
    columns:
      - name: product_hk
        data_type: STRING
        description: Product hash key. Primary key of the hub.
        data_tests: [unique, not_null]
      - {name: product_id, data_type: STRING, description: "Product business key."}
      - {name: load_ts, data_type: TIMESTAMP, description: "First time the key was seen."}
      - {name: record_source, data_type: STRING, description: "Source that first delivered the key."}

  # ---------------------------------------------------------------- links
  - name: link_order_customer
    description: Link between an order and the customer who placed it.
    columns:
      - name: order_customer_hk
        data_type: STRING
        description: Link hash key of (order_id, customer_id).
        data_tests: [unique, not_null]
      - name: order_hk
        data_type: STRING
        description: Order hash key.
        data_tests:
          - relationships:
              arguments: {to: ref('hub_order'), field: order_hk}
      - name: customer_hk
        data_type: STRING
        description: Customer hash key.
        data_tests:
          - relationships:
              arguments: {to: ref('hub_customer'), field: customer_hk}
      - {name: load_ts, data_type: TIMESTAMP, description: "First time the pair was seen."}

  - name: link_order_line
    description: Link between an order and a product, with order_line_id as dependent child key.
    columns:
      - name: order_line_hk
        data_type: STRING
        description: Link hash key of (order_id, product_id, order_line_id).
        data_tests: [unique, not_null]
      - name: order_hk
        data_type: STRING
        description: Order hash key.
        data_tests:
          - relationships:
              arguments: {to: ref('hub_order'), field: order_hk}
      - name: product_hk
        data_type: STRING
        description: Product hash key.
        data_tests:
          - relationships:
              arguments: {to: ref('hub_product'), field: product_hk}
      - {name: order_line_id, data_type: STRING, description: "Dependent child key: the order line identifier."}
      - {name: load_ts, data_type: TIMESTAMP, description: "First time the line was seen."}

  # ---------------------------------------------------------------- satellites
  - name: sat_customer_details
    description: Descriptive customer attributes with full history (one row per change).
    columns:
      - name: customer_hk
        data_type: STRING
        description: Customer hash key.
        data_tests:
          - relationships:
              arguments: {to: ref('hub_customer'), field: customer_hk}
      - {name: load_ts, data_type: TIMESTAMP, description: "When this version was loaded."}
      - {name: customer_hashdiff, data_type: STRING, description: "Hashdiff of the attributes."}
      - {name: segment, data_type: STRING, description: "Customer segment."}
      - {name: country, data_type: STRING, description: "Country code."}
      - {name: email, data_type: STRING, description: "Email address."}
      - {name: is_deleted, data_type: BOOL, description: "Soft-delete flag."}

  - name: sat_order_details
    description: Order header attributes with history (status changes).
    columns:
      - name: order_hk
        data_type: STRING
        description: Order hash key.
        data_tests:
          - relationships:
              arguments: {to: ref('hub_order'), field: order_hk}
      - {name: load_ts, data_type: TIMESTAMP, description: "When this version was loaded."}
      - {name: order_hashdiff, data_type: STRING, description: "Hashdiff of the attributes."}
      - {name: order_date, data_type: DATE, description: "Order date."}
      - {name: status, data_type: STRING, description: "Order status."}
      - {name: currency, data_type: STRING, description: "Currency code."}

  - name: sat_product_details
    description: Product attributes with history (price changes).
    columns:
      - name: product_hk
        data_type: STRING
        description: Product hash key.
        data_tests:
          - relationships:
              arguments: {to: ref('hub_product'), field: product_hk}
      - {name: load_ts, data_type: TIMESTAMP, description: "When this version was loaded."}
      - {name: product_hashdiff, data_type: STRING, description: "Hashdiff of the attributes."}
      - {name: product_name, data_type: STRING, description: "Product name."}
      - {name: category, data_type: STRING, description: "Product category."}
      - {name: list_price, data_type: NUMERIC, description: "List price."}

  - name: sat_order_line_details
    description: Order line quantities and prices.
    columns:
      - name: order_line_hk
        data_type: STRING
        description: Order line link hash key.
        data_tests:
          - relationships:
              arguments: {to: ref('link_order_line'), field: order_line_hk}
      - {name: load_ts, data_type: TIMESTAMP, description: "When this version was loaded."}
      - {name: order_line_hashdiff, data_type: STRING, description: "Hashdiff of the attributes."}
      - {name: quantity, data_type: INT64, description: "Units ordered."}
      - {name: unit_price, data_type: NUMERIC, description: "Price per unit."}
